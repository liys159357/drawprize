#            auth:
#              filter:
#                excludePaths:
#                  - /api/lottery/login
#                  - /api/lottery/register
#                  - /api/users/login
#                  - /api/users/register
      routes:
        - id: lottery-service
          uri: lb://lottery-service
          predicates:
            - Path=/api/lottery/**
        - id: prize-service
          uri: lb://prize-service
          predicates:
            - Path=/api/prizes/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
hm:
  jwt:
    location: classpath:hmall.jks  #秘钥地址
    alias: hmall   #秘钥别名
    password: hmall123  #密钥密码
    tokenTTL: 30m  #登录有效期
ss:
  auth:
    excludePaths:  #无需登录效验的路径
      - /users/login
      - /users/register
      -

#      - /api/users/register


