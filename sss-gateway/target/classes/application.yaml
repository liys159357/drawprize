server:
  port: 8080
spring:
  main:
    web-application-type: reactive
  cloud:
    nacos:
      server-addr: 192.168.118.129:8848
    gateway:
#      default-filters: # 配置全局过滤器
#        - name: auth-global-filter  # 改为小写短横线形式
